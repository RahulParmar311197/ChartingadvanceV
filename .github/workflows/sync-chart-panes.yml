name: One-time chart pane sync migration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply synchronization wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          h = Path('src/chart-pane-sync.js')
          h.write_text('''const listeners = new Map();\n\nexport function rangesEqual(a, b, epsilon = 0.01) {\n  return Boolean(a && b && Math.abs(a.from - b.from) <= epsilon && Math.abs(a.to - b.to) <= epsilon);\n}\n\nexport function syncLogicalRange(source, target, lastRange = null) {\n  const range = source?.timeScale?.().getVisibleLogicalRange?.();\n  if (!range || rangesEqual(range, lastRange)) return lastRange;\n  target?.timeScale?.().setVisibleLogicalRange?.(range);\n  return { from: range.from, to: range.to };\n}\n\nexport function publishChartRange(channel, range) {\n  if (!range) return;\n  (listeners.get(channel) ?? []).forEach((listener) => listener({ from: range.from, to: range.to }));\n}\n\nexport function subscribeChartRange(channel, listener) {\n  const current = listeners.get(channel) ?? [];\n  current.push(listener);\n  listeners.set(channel, current);\n  return () => {\n    const next = (listeners.get(channel) ?? []).filter((item) => item !== listener);\n    if (next.length) listeners.set(channel, next); else listeners.delete(channel);\n  };\n}\n''')
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace('import { clampVisibleBars } from "./chart-interaction.js";', 'import { clampVisibleBars } from "./chart-interaction.js";\nimport { publishChartRange, subscribeChartRange } from "./chart-pane-sync.js";')
          s = s.replace('    chartRef.current = chart;\n    const series', '    chartRef.current = chart;\n    const handleRange = (range) => { if (range) publishChartRange("primary", range); };\n    chart.timeScale().subscribeVisibleLogicalRangeChange(handleRange);\n    const series', 1)
          s = s.replace('window.removeEventListener("resize", resize); overlaySeries.forEach', 'window.removeEventListener("resize", resize); chart.timeScale().unsubscribeVisibleLogicalRangeChange(handleRange); overlaySeries.forEach', 1)
          s = s.replace('    chartRef.current = chart;\n    const rsiLine', '    chartRef.current = chart;\n    const unsubscribeRange = subscribeChartRange("primary", (range) => { if (range) chart.timeScale().setVisibleLogicalRange(range); });\n    const rsiLine', 1)
          s = s.replace('window.removeEventListener("resize", resize); chart.remove(); };', 'window.removeEventListener("resize", resize); unsubscribeRange(); chart.remove(); };', 1)
          p.write_text(s)
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/chart-pane-sync.js
          git diff --cached --quiet || git commit -m "feat: wire synchronized chart panes"
          git push
