name: One-time chart pane sync migration
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply synchronization wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace('import { clampVisibleBars } from "./chart-interaction.js";', 'import { clampVisibleBars } from "./chart-interaction.js";\nimport { publishChartRange, subscribeChartRange } from "./chart-pane-sync.js";')
          s = s.replace('function Chart({ symbol, interval, indicators, visibleBars }) {', 'function Chart({ symbol, interval, indicators, visibleBars }) {')
          s = s.replace('    chartRef.current = chart;\n    const series', '    chartRef.current = chart;\n    const unsubscribeRange = subscribeChartRange("primary", (range) => publishChartRange("primary", range));\n    const handleRange = (range) => { if (range) publishChartRange("primary", range); };\n    chart.timeScale().subscribeVisibleLogicalRangeChange(handleRange);\n    const series')
          s = s.replace('window.removeEventListener("resize", resize); overlaySeries.forEach', 'window.removeEventListener("resize", resize); chart.timeScale().unsubscribeVisibleLogicalRangeChange(handleRange); unsubscribeRange(); overlaySeries.forEach')
          s = s.replace('function RsiPane({ symbol, interval, visibleBars }) {', 'function RsiPane({ symbol, interval, visibleBars }) {')
          s = s.replace('    chartRef.current = chart;\n    const rsiLine', '    chartRef.current = chart;\n    const unsubscribeRange = subscribeChartRange("secondary", (range) => { if (range) chart.timeScale().setVisibleLogicalRange(range); });\n    const rsiLine')
          s = s.replace('window.removeEventListener("resize", resize); chart.remove(); };', 'window.removeEventListener("resize", resize); unsubscribeRange(); chart.remove(); };', 1)
          p.write_text(s)
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "feat: wire synchronized chart panes"
          git push
